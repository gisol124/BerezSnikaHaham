<body class="d-flex flex-column min-vh-100">

    <!-- ===== Top menu (same on every page) ===== -->

        <div class="container">

            </div>
        </div>
    </nav>

    <!-- ===== Sign up form ===== -->
    <main class="flex-grow-1 container py-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <form class="card shadow p-4" id="signupForm">
                    <h2 class="text-center mb-3">Sign up</h2>

                    <div class="mb-3">
                        <label for="inputName" class="form-label">Name:</label>
                        <input type="text" id="inputName" class="form-control" minlength="3" maxlength="20" required>
                    </div>

                    <div class="mb-3">
                        <label for="inputEmail" class="form-label">Email:</label>
                        <input type="email" id="inputEmail" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="inputPass" class="form-label">Password:</label>
                        <input type="password" id="inputPass" class="form-control" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-fire w-100">Sign up</button>

                    <!-- Messages (errors etc.) appear here -->
                    <div id="message" class="text-center mt-3"></div>

                    <p class="text-center mt-2 mb-0">
                        Already have an account? <a href="login.html">Login</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        BerezSnikaHaham &copy; 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
